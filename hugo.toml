[params]
    # 第一块：介绍
    homeIntroTitle = "Eidola Academy 👋"
    homeIntroBody = "欢迎来到 Eidola Academy。"

	<!-- 自定义分享板块 -->
<section style="margin: 2rem 0; padding: 1.5rem; border: 2px dashed #007bff; border-radius: 10px; background-color: rgba(0, 123, 255, 0.05);">
    <h3 style="margin-top: 0;">你愿意分享你这周做了什么吗？</h3>
    <p>欢迎给我发邮件，分享你这周做的最重要的事情。可以是一幅图，一个小视频，或者一个文档。</p>
    <p>
        <strong>欢迎发送邮件：</strong>
        <a href="mailto:eidola4ai@gmail.com?subject=我这周做了这个" style="color: #007bff; font-weight: bold; text-decoration: underline;">
            eidola4ai@gmail.com
        </a>
    </p>
    <p style="font-size: 0.9rem; color: #666;">邮件题目：<strong>我这周做了这个</strong></p>
</section>

    # 第三块：行动/加入群聊
    homeActionTitle = "加入Eidola会员群"
    homeActionBody = "点击下方按钮加入会员群（仅限B站充电会员/Youtube会员）"
